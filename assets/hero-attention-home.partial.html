  <title>Attention coming home</title>
  <desc>Muted feed, clay attention sparks, then the F1 mind outline and clay heart. Concept 1 loop.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .mrh-bg { fill: #F7F0E6; }
      .mrh-feed-card { fill: #D6CFC4; }
      .mrh-feed-line { fill: #B8AFA3; }
      .mrh-spark { fill: #C45C26; }
      .mrh-mind {
        fill: none;
        stroke: #2F6B4F;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        animation: mrh-mind 7s ease-in-out infinite;
      }
      .mrh-heart {
        fill: none;
        stroke: #C45C26;
        stroke-width: 2.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 66;
        stroke-dashoffset: 66;
        opacity: 0;
        animation: mrh-heart 7s ease-in-out infinite;
      }
      .mrh-feed {
        animation: mrh-feed 7s ease-in-out infinite;
      }
      .mrh-spark {
        opacity: 0;
        transform-box: view-box;
        transform-origin: 0 0;
        transform: translate(0%, 0%);
      }
      .mrh-spark-a { animation: mrh-spark-a 7s ease-in-out infinite; }
      .mrh-spark-b { animation: mrh-spark-b 7s ease-in-out infinite; }
      .mrh-spark-c { animation: mrh-spark-c 7s ease-in-out infinite; }

      /* 0–1.2s feed full; 3.2–5s feed fades; hidden through hold */
      @keyframes mrh-feed {
        0%, 40% { opacity: 1; }
        45.7% { opacity: 0.85; }
        71.4%, 100% { opacity: 0; }
      }
      /* 1.2–3.2s mind outline fades in; then holds */
      @keyframes mrh-mind {
        0%, 17.1% { opacity: 0; }
        28.6% { opacity: 0.7; }
        45.7%, 100% { opacity: 1; }
      }
      /* 5–6.2s heart draws/fades in; hold complete F1 */
      @keyframes mrh-heart {
        0%, 71.4% { opacity: 0; stroke-dashoffset: 66; }
        88.6%, 100% { opacity: 1; stroke-dashoffset: 0; }
      }
      /* Sparks: appear at feed → drift (mid = spread in mind) → tighten on heart → fade */
      @keyframes mrh-spark-a {
        0% { opacity: 0; transform: translate(0%, 0%); }
        7% { opacity: 1; transform: translate(0%, 0%); }
        17.1% { opacity: 1; transform: translate(0%, 0%); }
        25.7% { opacity: 1; transform: translate(calc(var(--mx) * 0.38), calc(var(--my) * 0.38 + var(--arc))); }
        45.7% { opacity: 1; transform: translate(var(--mx), var(--my)); }
        71.4% { opacity: 1; transform: translate(var(--dx), var(--dy)); }
        82% { opacity: 0.3; transform: translate(var(--dx), var(--dy)); }
        88.6%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
      }
      @keyframes mrh-spark-b {
        0%, 3% { opacity: 0; transform: translate(0%, 0%); }
        11% { opacity: 1; transform: translate(0%, 0%); }
        18% { opacity: 1; transform: translate(0%, 0%); }
        27% { opacity: 1; transform: translate(calc(var(--mx) * 0.40), calc(var(--my) * 0.40 + var(--arc))); }
        47% { opacity: 1; transform: translate(var(--mx), var(--my)); }
        71.4% { opacity: 1; transform: translate(var(--dx), var(--dy)); }
        84% { opacity: 0.25; transform: translate(var(--dx), var(--dy)); }
        90%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
      }
      @keyframes mrh-spark-c {
        0%, 6% { opacity: 0; transform: translate(0%, 0%); }
        14% { opacity: 1; transform: translate(0%, 0%); }
        19.5% { opacity: 1; transform: translate(0%, 0%); }
        28.5% { opacity: 1; transform: translate(calc(var(--mx) * 0.36), calc(var(--my) * 0.36 + var(--arc))); }
        48.5% { opacity: 1; transform: translate(var(--mx), var(--my)); }
        71.4% { opacity: 1; transform: translate(var(--dx), var(--dy)); }
        85% { opacity: 0.2; transform: translate(var(--dx), var(--dy)); }
        91%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
      }

      @media (prefers-reduced-motion: reduce) {
        .mrh-feed,
        .mrh-spark {
          animation: none !important;
          opacity: 0 !important;
          visibility: hidden !important;
        }
        .mrh-mind,
        .mrh-heart {
          animation: none !important;
          opacity: 1 !important;
          visibility: visible !important;
          stroke-dashoffset: 0 !important;
        }
      }
    ]]></style>
  </defs>

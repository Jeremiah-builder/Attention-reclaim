      <rect width="64" height="64" fill="#fff"/>
      <path d="M46 17H25.5a2.5 2.5 0 0 0 0 5a2.5 2.5 0 0 0 0 5a2.5 2.5 0 0 0 .5 5H46z" fill="#000"/>
    </mask>
  </defs>

<!--
  Shared site chrome snip — Attention Reclaim
  Visual: cream #F7F0E6, clay #C45C26, leaf #2F6B4F, ink #1A1614
  Fonts: Fraunces (brand) + Source Sans 3 (nav)
  Only Newsletter is the clay pill (nav-cta). Invite us is a normal text link.
  Mark current page with aria-current="page" on the matching <a>.
-->
<style>

    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(247, 240, 230, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #E6DCCD;
      font-family: "Source Sans 3", system-ui, sans-serif;
    }
    .site-header .inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
    }
    .site-header .brand {
      font-family: Fraunces, Georgia, serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: #1A1614;
      text-decoration: none;
      margin-right: auto;
    }
    .site-header .brand:hover { color: #C45C26; }
    .site-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 4px;
    }
    .site-nav a {
      color: #5C534C;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 999px;
    }
    .site-nav a:hover { color: #1A1614; background: #FFFBF5; }
    .site-nav a[aria-current="page"] {
      color: #2F6B4F;
      background: #E8F0EA;
    }
    .site-nav .nav-cta {
      background: #C45C26;
      color: #FFFBF5 !important;
      margin-left: 4px;
    }
    .site-nav .nav-cta:hover { background: #A84C1F; color: #FFFBF5 !important; }
    .site-nav a.nav-cta[aria-current="page"] {
      background: #2F6B4F;
      color: #FFFBF5 !important;
    }
    @media (max-width: 640px) {
      .site-header .inner { padding: 10px 14px; }
      .site-nav { width: 100%; }
      .site-nav a { padding: 8px 10px; font-size: 0.9rem; }
      .site-nav .nav-cta { margin-left: 0; }
    }
    .site-footer {
      background: #2A221C;
      color: #a8a29e;
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 14px;
      padding: 48px 20px;
    }
    .site-footer .wrap { max-width: 720px; margin: 0 auto; }
    .site-footer .oneliner { color: #fafaf9; margin-bottom: 16px; }
    .site-footer .cols {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      margin-bottom: 18px;
    }
    .site-footer .cols h3 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #a8a29e;
      font-weight: 600;
    }
    .site-footer a {
      color: #e7e5e4;
      text-decoration: none;
      display: inline-block;
      margin: 0 12px 8px 0;
    }
    .site-footer a:hover { color: #F3DCC8; }
    .site-footer .legal { margin: 8px 0 0; font-size: 13px; }

</style>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="/">Attention Reclaim</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/how-it-works">How it works</a>
      <a href="/better-ways">Better ways</a>
      <a href="/research">Research</a>
      <a href="/volunteer">Volunteer</a>
      <a href="/invite">Invite us</a>
      <a class="nav-cta" href="/#newsletter">Newsletter</a>
    </nav>
  </div>
</header>
